services:
  - type: web
    name: scantrust
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn scantrust.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/catalog
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SCANTRUST_GRACE_S
        value: "10"
